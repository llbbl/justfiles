name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Explicit bash adds pipefail; the implicit default shell is only `bash -e`.
defaults:
  run:
    shell: bash

jobs:
  # Real build on a fresh runner: proves the Homebrew libs and build tools
  # `just php setup` relies on exist on a clean Mac. Slow, so not on every push.
  macos-php-setup:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MISE_YES: "1"
      # mise fetches the php plugin and versions from GitHub; unauthenticated
      # calls from shared runner IPs get rate limited.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install just mise
      - name: just php setup in a scratch project
        run: |
          PHP_PIN="$(mise ls-remote php | grep -E '^8\.4\.[0-9]+$' | sort -t. -k3,3n | tail -n 1)"
          test -n "$PHP_PIN"
          echo "pin: $PHP_PIN"
          PIN="$PHP_PIN" ./test/integration/smoke.sh

  macos-brew-setup:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is core's current php, served as an alias; 8.4 is a versioned formula.
        pin: ["8.4", "8.5"]
    name: macos-brew-setup (${{ matrix.pin }})
    env:
      PHP_BACKEND: brew
      PIN: ${{ matrix.pin }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install just
      - run: ./test/integration/smoke.sh

  # Each python backend on a fresh Mac. mise and uv download prebuilt CPython.
  macos-python-setup:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [mise, uv, brew]
    name: macos-python-setup (${{ matrix.backend }})
    env:
      MISE_YES: "1"
      GITHUB_TOKEN: ${{ github.token }}
      MODULE: python
      PIN: "3.13"
      PYTHON_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install just
      - if: matrix.backend != 'brew'
        run: brew install ${{ matrix.backend }}
      - run: ./test/integration/smoke.sh

  # Real installs from each distro's package manager and the repos it adds.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ubuntu, debian, fedora, arch, alpine, python-ubuntu, python-debian, python-fedora, python-arch, python-alpine]
    name: linux (${{ matrix.service }})
    steps:
      - uses: actions/checkout@v5
      - run: ./test/run.sh ${{ matrix.service }}
        env:
          COMPOSE_FILE: integration/compose.yaml
