# Real `just MODULE setup` per distro, network on. Each pins a minor its backend
# can install; debian pins a php patch and node-debian an exact node to cover
# the coarse-backend warning, python-ubuntu a minor that needs ppa:deadsnakes,
# node-fedora a side-by-side major (node-24, npm-24), and PIN2 a switch to
# another major where packages conflict or the repo is rewritten.
x-smoke: &smoke
  volumes: ["../..:/repo:ro"]

x-ubuntu: &ubuntu
  <<: *smoke
  image: justfiles-integration-ubuntu
  build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}" } }
x-debian: &debian
  <<: *smoke
  image: justfiles-integration-debian
  build: { context: ., args: { BASE_IMAGE: "debian:13", JUST_VERSION: "${JUST_VERSION:-1.46.0}" } }
x-fedora: &fedora
  <<: *smoke
  image: justfiles-integration-fedora
  build: { context: ., args: { BASE_IMAGE: "fedora:43", JUST_VERSION: "${JUST_VERSION:-1.46.0}" } }
x-arch: &arch
  <<: *smoke
  image: justfiles-integration-arch
  platform: linux/amd64 # archlinux publishes no arm64 image
  build: { context: ., args: { BASE_IMAGE: "archlinux:base", JUST_VERSION: "${JUST_VERSION:-1.46.0}" } }
x-alpine: &alpine
  <<: *smoke
  image: justfiles-integration-alpine
  build: { context: ., args: { BASE_IMAGE: "alpine:3.22", JUST_VERSION: "${JUST_VERSION:-1.46.0}" } }

services:
  ubuntu: { <<: *ubuntu, environment: { PIN: "8.4" } }
  debian: { <<: *debian, environment: { PIN: "8.5.0" } }
  fedora: { <<: *fedora, environment: { PIN: "8.5" } }
  arch: { <<: *arch, environment: { PIN: "8.3" } }
  alpine: { <<: *alpine, environment: { PIN: "8.4" } }
  python-ubuntu: { <<: *ubuntu, environment: { MODULE: python, PIN: "3.13" } }
  python-debian: { <<: *debian, environment: { MODULE: python, PIN: "3.13" } }
  python-fedora: { <<: *fedora, environment: { MODULE: python, PIN: "3.12" } }
  python-arch: { <<: *arch, environment: { MODULE: python, PIN: "3.14" } }
  python-alpine: { <<: *alpine, environment: { MODULE: python, PIN: "3.12" } }
  node-ubuntu: { <<: *ubuntu, environment: { MODULE: node, PIN: "24", PIN2: "22" } }
  node-debian: { <<: *debian, environment: { MODULE: node, PIN: "22.0.0" } }
  node-fedora: { <<: *fedora, environment: { MODULE: node, PIN: "24" } }
  node-arch: { <<: *arch, environment: { MODULE: node, PIN: "26", PIN2: "22" } }
  node-alpine: { <<: *alpine, environment: { MODULE: node, PIN: "23", PIN2: "22" } }

  # Version-manager backends, each image with that one tool installed. On Alpine
  # only uv: nodejs.org ships no musl builds and mise compiles python there. mise
  # calls the GitHub API, which rate limits shared IPs without a token.
  python-mise:
    <<: *smoke
    image: justfiles-integration-ubuntu-mise
    build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: mise } }
    environment: { MODULE: python, PIN: "3.13", PYTHON_BACKEND: mise, MISE_YES: "1", GITHUB_TOKEN: null }
  python-uv:
    <<: *smoke
    image: justfiles-integration-ubuntu-uv
    build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: uv } }
    environment: { MODULE: python, PIN: "3.13", PYTHON_BACKEND: uv }
  node-mise:
    <<: *smoke
    image: justfiles-integration-ubuntu-mise
    build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: mise } }
    environment: { MODULE: node, PIN: "24", PIN2: "22", NODE_BACKEND: mise, MISE_YES: "1", GITHUB_TOKEN: null }
  node-nvm:
    <<: *smoke
    image: justfiles-integration-ubuntu-nvm
    build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: nvm } }
    environment: { MODULE: node, PIN: "24", PIN2: "22", NODE_BACKEND: nvm }
  node-fnm:
    <<: *smoke
    image: justfiles-integration-ubuntu-fnm
    build: { context: ., args: { BASE_IMAGE: "ubuntu:24.04", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: fnm } }
    environment: { MODULE: node, PIN: "24", PIN2: "22", NODE_BACKEND: fnm }
  python-uv-alpine:
    <<: *smoke
    image: justfiles-integration-alpine-uv
    build: { context: ., args: { BASE_IMAGE: "alpine:3.22", JUST_VERSION: "${JUST_VERSION:-1.46.0}", TOOL: uv } }
    environment: { MODULE: python, PIN: "3.13", PYTHON_BACKEND: uv }
